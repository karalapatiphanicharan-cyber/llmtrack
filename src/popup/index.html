<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMTrack</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-area">
        <div class="brand-left">
          <img src="../../assets/icons/icon-128.png" alt="LLMTrack Logo" class="product-logo">
          <div class="brand-text">
            <span class="logo-text">LLMTrack</span>
            <p class="subtitle">AI Usage Intelligence</p>
          </div>
        </div>
        <span class="badge">● Phase 2</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="popup-main">
      <!-- Current Session Section -->
      <section class="section current-section">
        <div class="section-header">
          <span class="section-title">CURRENT SESSION</span>
          <span id="detection-status" class="status-badge inactive">INACTIVE</span>
        </div>

        <div class="current-display">
          <div id="detection-indicator" class="indicator inactive"></div>
          <span id="detected-platform" class="detected-text">No supported LLM</span>
        </div>

        <div id="current-card" class="detail-rows">
          <div class="detail-row">
            <span class="detail-label">Started Today</span>
            <span id="session-started-today" class="detail-value">-</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Current Session</span>
            <span id="session-current-start" class="detail-value">-</span>
          </div>
        </div>
      </section>

      <!-- Today's Usage Section -->
      <section class="section today-section">
        <div class="section-header">
          <span class="section-title">TODAY</span>
        </div>

        <ul class="platform-list">
          <li class="platform-row">
            <div class="platform-left">
              <span class="dot chatgpt"></span>
              <span class="platform-name">ChatGPT</span>
            </div>
            <span id="usage-chatgpt" class="platform-time">0s</span>
          </li>
          <li class="platform-row">
            <div class="platform-left">
              <span class="dot gemini"></span>
              <span class="platform-name">Gemini</span>
            </div>
            <span id="usage-gemini" class="platform-time">0s</span>
          </li>
          <li class="platform-row">
            <div class="platform-left">
              <span class="dot claude"></span>
              <span class="platform-name">Claude</span>
            </div>
            <span id="usage-claude" class="platform-time">0s</span>
          </li>
        </ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="footer-status">
        <div class="footer-status-left">
          <span class="footer-dot active"></span>
          <span class="footer-label">TRACKING ENGINE</span>
        </div>
        <span id="engine-status" class="engine-badge active">ACTIVE</span>
      </div>
      <p class="privacy-promise">Privacy-first · Conversations are never read or stored.</p>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
